# Panda Touch — display bring-up ONLY. Draws a test pattern, nothing else.
#
# Pin map and timings are the REAL ones, taken from Disttrack/PandaTouch_streamDeck
# (docs/PINOUT.md and src/pt/pt_board.h) - working code on this exact board, not a guess.
#
# Flash this before the UI anyway. It is a five-minute check that the panel comes up, and a
# wrong value is legible on colour bars where it would be baffling on a dashboard.
#
# BACK UP THE STOCK FIRMWARE FIRST:
#   esptool --port /dev/cu.usbserial-XXXX read_flash 0x0 0x1000000 panda_stock_backup.bin

esphome:
  name: panda-touch
  friendly_name: Panda Touch

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      # 800x480 RGB565 is a 768KB framebuffer and lives in PSRAM.
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  # UART0 is wired to the CH340K that the USB-C port bridges to, so logs come back over the
  # same cable used to flash.
  hardware_uart: UART0

# Deliberately no wifi/api/ota. This is a bench test of the panel over the serial cable, and
# leaving them out means it needs no credentials and cannot fail for network reasons - if the
# screen stays dark, the panel config is the only thing it can be.

output:
  - platform: ledc
    pin: 21
    frequency: 30000Hz     # PT_LCD_BL_FREQUENCY_HZ
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Display Backlight
    id: back_light
    restore_mode: ALWAYS_ON

display:
  # rpi_dpi_rgb, not mipi_rgb: mipi_rgb is for panels whose controller is configured over
  # SPI (it registers as an SPIDevice and demands an init_sequence). This panel has no SPI
  # lines at all - it is a raw RGB parallel bus. Pins and timings from
  # Disttrack/PandaTouch_streamDeck src/pt/pt_board.h.
  - platform: rpi_dpi_rgb
    id: main_display
    update_interval: 1s
    auto_clear_enabled: false
    dimensions:
      width: 800
      height: 480
    de_pin: 38
    pclk_pin: 5
    reset_pin: 46
    # This panel is DE-only: HSYNC and VSYNC are not routed on the FPC (pt_board.h has both
    # as -1). ESPHome requires the options anyway, and the ESP32-S3 LCD peripheral generates
    # the signals regardless, so they are pointed at the only free GPIOs on the board and
    # drive nothing. GPIO45 is a strapping pin (VDD_SPI) but is safe as a post-boot output -
    # the board already uses GPIO46, also strapping, for LCD reset.
    hsync_pin: 42
    vsync_pin: 45
    pclk_frequency: 14.8MHz
    color_order: RGB
    hsync_pulse_width: 4
    hsync_back_porch: 16
    hsync_front_porch: 16
    vsync_pulse_width: 4
    vsync_back_porch: 32
    vsync_front_porch: 32
    # Listed least- to most-significant bit, matching R3..R7 / G2..G7 / B3..B7 in pt_board.h.
    data_pins:
      red: [6, 7, 8, 9, 10]
      green: [11, 12, 13, 14, 15, 16]
      blue: [17, 18, 48, 47, 39]
    lambda: |-
      // Colour bars prove the channel arrays are ordered correctly; corner markers prove
      // geometry and orientation; the border proves the full extent is addressable.
      it.filled_rectangle(0,   0, 200, 480, Color(255, 0, 0));
      it.filled_rectangle(200, 0, 200, 480, Color(0, 255, 0));
      it.filled_rectangle(400, 0, 200, 480, Color(0, 0, 255));
      it.filled_rectangle(600, 0, 200, 480, Color(255, 255, 255));
      it.filled_rectangle(0,     0, 40, 40, Color(255, 255, 0));   // top-left
      it.filled_rectangle(760,   0, 40, 40, Color(0, 255, 255));   // top-right
      it.filled_rectangle(0,   440, 40, 40, Color(255, 0, 255));   // bottom-left
      it.filled_rectangle(760, 440, 40, 40, Color(0, 0, 0));       // bottom-right
      it.rectangle(0, 0, 800, 480, Color(255, 255, 255));

# I2C0 carries the GT911. Left enabled here because the addresses are known and a scan is
# useful confirmation, but touch input itself is not wired up until the panel is proven.
i2c:
  - id: bus_touch
    sda: 2
    scl: 1
    frequency: 100kHz
    scan: true          # expect 0x5D (or 0x14) in the log = GT911 present

