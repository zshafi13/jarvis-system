# Panda Touch — the Jarvis visual interface.
#
# Display only. Voice input and output stay on the Pi satellite; this screen just reacts to what
# the pipeline is doing, via assist_satellite.jarvis_pi3_2, which reports exactly four states:
#   idle | listening | processing | responding
#
# Flash panda-touch-bringup.yaml FIRST and confirm the test pattern. The pin block below is the
# same hypothesis and there is no point debugging a dashboard when the panel itself is unproven.

substitutions:
  satellite: assist_satellite.jarvis_pi3_2

esphome:
  name: panda-touch
  friendly_name: Panda Touch
  on_boot:
    - lvgl.page.show: page_idle

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO          # DEBUG floods the log once LVGL is running
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Panda Touch Fallback"

time:
  - platform: homeassistant
    id: ha_time

output:
  - platform: ledc
    pin: 2
    frequency: 1220
    id: backlight_pwm
light:
  - platform: monochromatic
    output: backlight_pwm
    name: Display Backlight
    id: back_light
    restore_mode: ALWAYS_ON

display:
  - platform: rpi_dpi_rgb
    id: main_display
    auto_clear_enabled: false
    update_interval: never        # LVGL drives redraws itself
    color_order: RGB
    invert_colors: true
    dimensions: {width: 800, height: 480}
    de_pin: 40
    hsync_pin: 39
    vsync_pin: 41
    pclk_pin: 42
    pclk_frequency: 12.5MHz
    hsync_pulse_width: 4
    hsync_front_porch: 8
    hsync_back_porch: 8
    vsync_pulse_width: 4
    vsync_front_porch: 8
    vsync_back_porch: 8
    data_pins:
      red: [45, 48, 47, 21, 14]
      green: [5, 6, 7, 15, 16, 4]
      blue: [8, 3, 46, 9, 1]

i2c:
  sda: 19
  scl: 20
  scan: true

touchscreen:
  - platform: gt911
    id: my_touch
    display: main_display

# ---------------------------------------------------------------- state from Home Assistant

globals:
  - id: wave_phase
    type: int
    initial_value: '0'
  - id: is_active           # true whenever Jarvis is listening/thinking/speaking
    type: bool
    initial_value: 'false'

text_sensor:
  # The single source of truth for what the screen shows. No custom protocol, no polling -
  # the satellite entity already transitions through the whole pipeline lifecycle.
  - platform: homeassistant
    id: satellite_state
    entity_id: ${satellite}
    on_value:
      then:
        - lambda: |-
            id(is_active) = (x != "idle" && x != "unavailable" && x != "unknown");
        - if:
            condition:
              lambda: 'return id(is_active);'
            then:
              - lvgl.label.update:
                  id: status_label
                  text: !lambda |-
                    if (x == "listening")  return "LISTENING";
                    if (x == "processing") return "THINKING";
                    if (x == "responding") return "SPEAKING";
                    return "";
              # Colour carries the state so it reads across the room without the label.
              - lvgl.bar.update:
                  id: [wv0, wv1, wv2, wv3, wv4, wv5, wv6, wv7, wv8]
                  indicator:
                    bg_color: !lambda |-
                      if (x == "listening")  return lv_color_hex(0x00E5FF);  // cyan
                      if (x == "processing") return lv_color_hex(0xFFB300);  // amber
                      return lv_color_hex(0x00FF9C);                          // green
              - lvgl.page.show: page_active
            else:
              - lvgl.page.show: page_idle

  - platform: homeassistant
    id: weather_state
    entity_id: weather.forecast_home
    on_value:
      - lvgl.label.update: {id: weather_label, text: !lambda 'return x.c_str();'}

  - platform: homeassistant
    id: printer_state
    entity_id: sensor.p1s_01p00a3c2300447_print_status
    on_value:
      - lvgl.label.update: {id: printer_label, text: !lambda 'return ("P1S: " + x).c_str();'}

sensor:
  - platform: homeassistant
    id: weather_temp
    entity_id: weather.forecast_home
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: temp_label
          text: !lambda 'return (esphome::to_string((int)x) + "°F").c_str();'
  - platform: homeassistant
    id: printer_progress
    entity_id: sensor.p1s_01p00a3c2300447_print_progress
    on_value:
      - lvgl.bar.update: {id: print_bar, value: !lambda 'return (int)x;'}

# Animates the waveform only while Jarvis is active. Stopping when idle keeps the panel quiet
# and avoids redrawing 9 widgets 10x/second for no reason.
interval:
  # Clock ticks locally so the idle page stays live between Home Assistant updates.
  - interval: 1s
    then:
      - lvgl.label.update:
          id: clock_label
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("--:--");
            char buf[8];
            snprintf(buf, sizeof(buf), "%d:%02d", (t.hour % 12 == 0) ? 12 : t.hour % 12, t.minute);
            return std::string(buf);

  - interval: 100ms
    then:
      - if:
          condition:
            lambda: 'return id(is_active);'
          then:
            - lambda: |-
                id(wave_phase) += 1;
                const int ids_count = 9;
                static const float speed[ids_count] = {1.7, 2.3, 1.1, 2.9, 1.3, 2.6, 1.9, 3.1, 1.5};
                float t = id(wave_phase) * 0.35f;
                int v[ids_count];
                for (int i = 0; i < ids_count; i++) {
                  // Layered sines: reads as speech rather than a uniform pulse.
                  float a = sinf(t * speed[i] + i) * 0.5f + 0.5f;
                  float b = sinf(t * speed[i] * 0.5f + i * 2.0f) * 0.5f + 0.5f;
                  v[i] = (int)(12 + (a * 0.65f + b * 0.35f) * 88);
                }
                lv_bar_set_value(id(wv0), v[0], LV_ANIM_ON);
                lv_bar_set_value(id(wv1), v[1], LV_ANIM_ON);
                lv_bar_set_value(id(wv2), v[2], LV_ANIM_ON);
                lv_bar_set_value(id(wv3), v[3], LV_ANIM_ON);
                lv_bar_set_value(id(wv4), v[4], LV_ANIM_ON);
                lv_bar_set_value(id(wv5), v[5], LV_ANIM_ON);
                lv_bar_set_value(id(wv6), v[6], LV_ANIM_ON);
                lv_bar_set_value(id(wv7), v[7], LV_ANIM_ON);
                lv_bar_set_value(id(wv8), v[8], LV_ANIM_ON);

# ---------------------------------------------------------------- UI

lvgl:
  displays: [main_display]
  touchscreens: [my_touch]
  theme:
    obj:
      bg_color: 0x101418
      border_color: 0x1E2A33
      text_color: 0xE8F1F8
    button:
      bg_color: 0x16212B
      border_color: 0x00E5FF
      border_width: 2
      radius: 10
      text_color: 0xE8F1F8

  pages:
    # ---- ambient dashboard -------------------------------------------------
    - id: page_idle
      bg_color: 0x101418
      widgets:
        - label:
            id: clock_label
            align: TOP_MID
            y: 28
            text_font: montserrat_48
            text_color: 0x00E5FF
            text: "--:--"
        - label:
            id: weather_label
            align: TOP_MID
            y: 96
            text: "—"
        - label:
            id: temp_label
            align: TOP_MID
            y: 122
            text_color: 0x8FA6B4
            text: "—"
        - label:
            id: printer_label
            align: TOP_LEFT
            x: 24
            y: 24
            text_color: 0x8FA6B4
            text: "P1S: —"
        - bar:
            id: print_bar
            align: TOP_LEFT
            x: 24
            y: 48
            width: 180
            height: 8
            min_value: 0
            max_value: 100
            value: 0
        # Only entities that are safe by voice appear here. switch.desk_power feeds the GPU box
        # that runs Ollama/Whisper/Piper, and the printer fans can ruin an in-progress print -
        # both are hidden from Assist for the same reason, so neither gets a button.
        - button:
            id: btn_lab_fan
            align: BOTTOM_LEFT
            x: 40
            y: -40
            width: 200
            height: 84
            widgets:
              - label: {align: CENTER, text: "Lab Fan"}
            on_click:
              - homeassistant.action:
                  action: fan.toggle
                  data: {entity_id: fan.lab_fan}
        - button:
            id: btn_lab_light
            align: BOTTOM_MID
            y: -40
            width: 200
            height: 84
            widgets:
              - label: {align: CENTER, text: "Lab Light"}
            on_click:
              - homeassistant.action:
                  action: light.toggle
                  data: {entity_id: light.lab_ceiling_light}
        - button:
            id: btn_desk_light
            align: BOTTOM_RIGHT
            x: -40
            y: -40
            width: 200
            height: 84
            widgets:
              - label: {align: CENTER, text: "Desk Light"}
            on_click:
              - homeassistant.action:
                  action: light.toggle
                  data: {entity_id: light.desk}

    # ---- listening / thinking / speaking -----------------------------------
    - id: page_active
      bg_color: 0x0A0E12
      widgets:
        - label:
            id: status_label
            align: TOP_MID
            y: 70
            text_font: montserrat_28
            text_color: 0x8FA6B4
            text: ""
        # Nine bars, centre-aligned so they grow symmetrically from the middle.
        - bar: {id: wv0, align: CENTER, x: -224, width: 28, height: 260, min_value: 0, max_value: 100, value: 20}
        - bar: {id: wv1, align: CENTER, x: -168, width: 28, height: 260, min_value: 0, max_value: 100, value: 40}
        - bar: {id: wv2, align: CENTER, x: -112, width: 28, height: 260, min_value: 0, max_value: 100, value: 60}
        - bar: {id: wv3, align: CENTER, x:  -56, width: 28, height: 260, min_value: 0, max_value: 100, value: 80}
        - bar: {id: wv4, align: CENTER, x:    0, width: 28, height: 260, min_value: 0, max_value: 100, value: 95}
        - bar: {id: wv5, align: CENTER, x:   56, width: 28, height: 260, min_value: 0, max_value: 100, value: 80}
        - bar: {id: wv6, align: CENTER, x:  112, width: 28, height: 260, min_value: 0, max_value: 100, value: 60}
        - bar: {id: wv7, align: CENTER, x:  168, width: 28, height: 260, min_value: 0, max_value: 100, value: 40}
        - bar: {id: wv8, align: CENTER, x:  224, width: 28, height: 260, min_value: 0, max_value: 100, value: 20}

