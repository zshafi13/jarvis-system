site_name: jarvis-system
extra_css:
  - stylesheets/core.css
plugins:
  - search
  - include_dir_to_nav
extra:
  homepage: https://www.pwc.com
  contact_email: tyler.guryan@pwc.com
  repo_url: https://github.com/zshafi13/jarvis-system/tree/main
theme:
  logo: assets/pwc_logo.svg
  name: material
  custom_dir: overrides
  features:
    - content.code.select
    - content.code.copy
  palette: 
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode  
markdown_extensions:
  - callouts
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
