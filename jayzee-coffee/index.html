<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#1f2220" />
<title>JayZee Coffee Co</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
<style>
  :root {
    --board: #1f2220;
    --board-2: #272b28;
    --chalk: #f1ead8;
    --chalk-dim: #b9b2a2;
    --leaf: #7f9a6a;
    --wood: #8a5a32;
    --wood-light: #b07a48;
    --accent: #e7c07a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at top, #3b2c1e, #17120d 70%);
    font-family: "Patrick Hand", "Comic Sans MS", system-ui, sans-serif;
    color: var(--chalk);
    display: flex;
    justify-content: center;
    padding: 16px 12px 40px;
  }
  .frame {
    width: 100%;
    max-width: 560px;
    background: var(--wood);
    border-radius: 14px;
    padding: 12px;
    box-shadow: 0 20px 50px rgba(0,0,0,.6), inset 0 0 0 3px var(--wood-light);
  }
  .board {
    background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,.05), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(255,255,255,.04), transparent 40%),
      var(--board);
    border-radius: 6px;
    padding: 22px 18px 26px;
    position: relative;
    overflow: hidden;
  }
  header { text-align: center; position: relative; }
  .logo {
    font-family: "Caveat", cursive;
    font-size: 64px;
    line-height: .9;
    margin: 0;
    letter-spacing: 1px;
    text-shadow: 0 0 2px rgba(241,234,216,.4);
  }
  .sub { font-size: 26px; margin-top: 2px; color: var(--chalk); }
  .rule { border: 0; border-top: 2px dashed rgba(241,234,216,.35); margin: 14px 10px; }

  .tabs { display: flex; gap: 8px; justify-content: center; margin: 6px 0 4px; }
  .tab {
    background: none; border: 2px solid var(--chalk-dim); color: var(--chalk-dim);
    border-radius: 999px; padding: 4px 16px; font: inherit; font-size: 18px; cursor: pointer;
  }
  .tab.active { border-color: var(--chalk); color: var(--board); background: var(--chalk); }
  .badge { background: var(--accent); color: var(--board); border-radius: 999px; padding: 0 7px; margin-left: 4px; font-size: 14px; }

  .section-title {
    display: flex; align-items: center; gap: 10px; margin: 22px 0 10px;
    font-family: "Caveat", cursive; font-size: 30px;
  }
  .section-title::before, .section-title::after {
    content: ""; flex: 1; border-top: 2px solid rgba(241,234,216,.3);
  }
  .section-title span { border: 2px solid var(--chalk); border-radius: 999px; padding: 0 18px; }

  .options { display: grid; gap: 8px; }
  .opt {
    display: flex; align-items: center; gap: 12px; width: 100%;
    background: transparent; color: var(--chalk); font: inherit; font-size: 22px;
    border: 2px solid transparent; border-radius: 12px; padding: 8px 12px;
    cursor: pointer; text-align: left; transition: background .15s, border-color .15s;
  }
  .opt:hover { background: rgba(255,255,255,.04); }
  .opt.selected { border-color: var(--accent); background: rgba(231,192,122,.1); }
  .opt .icon { width: 34px; text-align: center; font-size: 24px; flex: none; }
  .opt .note { font-size: 16px; color: var(--chalk-dim); font-style: italic; margin-left: auto; }

  .row { display: flex; gap: 8px; }
  .pill {
    flex: 1; background: transparent; border: 2px solid var(--chalk-dim); color: var(--chalk);
    font: inherit; font-size: 20px; border-radius: 12px; padding: 8px; cursor: pointer;
  }
  .pill.selected { border-color: var(--accent); background: rgba(231,192,122,.12); }

  input[type=text], textarea {
    width: 100%; background: var(--board-2); border: 2px solid rgba(241,234,216,.3);
    color: var(--chalk); font: inherit; font-size: 20px; border-radius: 10px; padding: 10px 12px;
  }
  input::placeholder, textarea::placeholder { color: #7c7768; }
  textarea { resize: vertical; min-height: 52px; font-size: 18px; }
  label.small { display: block; font-size: 17px; color: var(--chalk-dim); margin: 10px 2px 4px; }

  .summary {
    margin-top: 20px; padding: 12px 14px; border: 2px dashed rgba(241,234,216,.4);
    border-radius: 12px; font-size: 20px; min-height: 50px; text-align: center;
  }
  .summary .muted { color: var(--chalk-dim); }

  .cta {
    width: 100%; margin-top: 14px; padding: 14px; font: inherit; font-size: 26px;
    font-family: "Caveat", cursive; font-weight: 700;
    background: var(--chalk); color: var(--board); border: 0; border-radius: 14px; cursor: pointer;
    box-shadow: 0 4px 0 #b9b2a2;
  }
  .cta:active { transform: translateY(2px); box-shadow: 0 2px 0 #b9b2a2; }
  .cta:disabled { opacity: .4; cursor: not-allowed; }

  /* Orders */
  .orders { display: grid; gap: 10px; margin-top: 14px; }
  .order {
    border: 2px solid rgba(241,234,216,.35); border-radius: 12px; padding: 10px 12px;
    display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center;
  }
  .order.done { opacity: .45; }
  .order .who { font-size: 22px; }
  .order .what { font-size: 18px; color: var(--chalk-dim); grid-column: 1; }
  .order .when { font-size: 14px; color: var(--chalk-dim); grid-column: 1; }
  .order .actions { grid-row: 1 / span 3; grid-column: 2; display: flex; flex-direction: column; gap: 6px; }
  .mini {
    font: inherit; font-size: 16px; border-radius: 8px; padding: 4px 10px; cursor: pointer;
    background: transparent; color: var(--chalk); border: 2px solid var(--chalk-dim);
  }
  .mini.go { background: var(--leaf); border-color: var(--leaf); color: #11140f; }
  .empty { text-align: center; color: var(--chalk-dim); font-size: 20px; padding: 30px 0; }
  .toolbar { display: flex; justify-content: flex-end; margin-top: 10px; }

  .deco { position: absolute; pointer-events: none; opacity: .55; }
  .sparkle { color: var(--chalk); font-size: 16px; }
  .cat { right: 10px; bottom: 6px; width: 90px; opacity: .8; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(120px);
    background: var(--chalk); color: var(--board); padding: 12px 22px; border-radius: 999px;
    font-size: 20px; box-shadow: 0 8px 24px rgba(0,0,0,.5); transition: transform .3s;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="frame">
  <div class="board">
    <span class="deco sparkle" style="top:18px;left:22px">✦</span>
    <span class="deco sparkle" style="top:60px;right:30px">✧</span>
    <span class="deco sparkle" style="top:40%;left:8px">✧</span>

    <header>
      <h1 class="logo">JayZee</h1>
      <div class="sub">Coffee Co</div>
      <hr class="rule" />
      <div class="tabs">
        <button class="tab active" data-view="order">Order</button>
        <button class="tab" data-view="queue">Orders <span class="badge" id="badge">0</span></button>
      </div>
    </header>

    <!-- ORDER VIEW -->
    <main id="view-order">
      <div class="section-title"><span>Season Favorites</span></div>
      <div class="options" id="favorites"></div>

      <div class="section-title"><span>Drinks</span></div>
      <div class="options" id="drinks"></div>

      <div class="section-title"><span>Flavors</span></div>
      <div class="options" id="flavors"></div>

      <div class="section-title"><span>Hot or Iced</span></div>
      <div class="row" id="temps"></div>

      <label class="small" for="name">Name for the order</label>
      <input type="text" id="name" placeholder="Who's it for?" autocomplete="off" />
      <label class="small" for="notes">Notes (optional)</label>
      <textarea id="notes" placeholder="extra shot, oat milk, less sweet..."></textarea>

      <div class="summary" id="summary"><span class="muted">Pick a drink ☕</span></div>
      <button class="cta" id="place" disabled>Place Order</button>
    </main>

    <!-- QUEUE VIEW -->
    <main id="view-queue" class="hidden">
      <div class="orders" id="orders"></div>
      <div class="toolbar"><button class="mini" id="clear-done">Clear finished</button></div>
    </main>

    <!-- sleeping cat doodle -->
    <svg class="deco cat" viewBox="0 0 120 60" fill="none" stroke="#f1ead8" stroke-width="2" stroke-linecap="round">
      <path d="M10 55 Q10 25 45 22 Q85 18 105 40 Q115 52 100 55 Z" fill="#141614"/>
      <path d="M22 30 L18 14 L32 24"/>
      <path d="M40 23 L44 9 L50 24"/>
      <path d="M26 36 q4 3 8 0"/>
      <path d="M40 36 q4 3 8 0"/>
      <path d="M100 55 Q118 50 112 38"/>
    </svg>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DRINKS = [
  { id: "latte",      name: "Latte",      icon: "☕", note: "milk + espresso" },
  { id: "americano",  name: "Americano",  icon: "🥛", note: "half milk half water" },
  { id: "espresso",   name: "Espresso",   icon: "⚡", note: "ur a psycho" },
  { id: "cappuccino", name: "Cappuccino", icon: "☁️", note: "" },
];
const FLAVORS = [
  { id: "none",        name: "No Flavor",            icon: "○" },
  { id: "brown-sugar", name: "Brown Sugar",          icon: "🧊" },
  { id: "sweet-cream", name: "Sweet Cream / Vanilla", icon: "✿" },
];
const FAVORITES = [
  { id: "fav-sc", name: "Hot Sweet Cream Latte", icon: "🍂", drink: "latte", flavor: "sweet-cream", temp: "Hot" },
  { id: "fav-bs", name: "Hot Brown Sugar Latte", icon: "🍁", drink: "latte", flavor: "brown-sugar", temp: "Hot" },
];
const TEMPS = ["Hot", "Iced"];
const STORE = "jayzee-orders";

const state = { drink: null, flavor: "none", temp: "Hot" };
const $ = (id) => document.getElementById(id);
const load = () => JSON.parse(localStorage.getItem(STORE) || "[]");
const save = (o) => localStorage.setItem(STORE, JSON.stringify(o));

function optButton({ icon, name, note }, selected, onClick) {
  const b = document.createElement("button");
  b.className = "opt" + (selected ? " selected" : "");
  b.innerHTML = `<span class="icon">${icon}</span><span>${name}</span>` +
    (note ? `<span class="note">(${note})</span>` : "");
  b.onclick = onClick;
  return b;
}

function isFavorite(f) {
  return state.drink === f.drink && state.flavor === f.flavor && state.temp === f.temp;
}

function describe() {
  if (!state.drink) return null;
  const fav = FAVORITES.find(isFavorite);
  if (fav) return fav.name;
  const drink = DRINKS.find(d => d.id === state.drink).name;
  const flavor = FLAVORS.find(f => f.id === state.flavor);
  return [state.temp, flavor.id === "none" ? "" : flavor.name, drink].filter(Boolean).join(" ");
}

function render() {
  $("favorites").replaceChildren(...FAVORITES.map(f =>
    optButton(f, isFavorite(f), () => { Object.assign(state, { drink: f.drink, flavor: f.flavor, temp: f.temp }); render(); })));
  $("drinks").replaceChildren(...DRINKS.map(d =>
    optButton(d, state.drink === d.id, () => { state.drink = d.id; render(); })));
  $("flavors").replaceChildren(...FLAVORS.map(f =>
    optButton(f, state.flavor === f.id, () => { state.flavor = f.id; render(); })));
  $("temps").replaceChildren(...TEMPS.map(t => {
    const b = document.createElement("button");
    b.className = "pill" + (state.temp === t ? " selected" : "");
    b.textContent = (t === "Hot" ? "🔥 " : "🧊 ") + t;
    b.onclick = () => { state.temp = t; render(); };
    return b;
  }));

  const desc = describe();
  const name = $("name").value.trim();
  $("summary").innerHTML = desc
    ? `${desc}${name ? ` <span class="muted">for</span> ${escapeHtml(name)}` : ""}`
    : `<span class="muted">Pick a drink ☕</span>`;
  $("place").disabled = !desc || !name;
  $("place").textContent = !desc ? "Pick a drink" : !name ? "Add a name" : "Place Order";

  renderOrders();
}

function renderOrders() {
  const orders = load();
  $("badge").textContent = orders.filter(o => !o.done).length;
  if (!orders.length) {
    $("orders").innerHTML = `<div class="empty">No orders yet ~ the cat is napping</div>`;
    return;
  }
  const sorted = [...orders].sort((a, b) => a.done - b.done || a.time - b.time);
  $("orders").replaceChildren(...sorted.map(o => {
    const el = document.createElement("div");
    el.className = "order" + (o.done ? " done" : "");
    const t = new Date(o.time).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    el.innerHTML = `
      <div class="who">#${o.num} · ${escapeHtml(o.name)}</div>
      <div class="what">${o.desc}${o.notes ? ` — <i>${escapeHtml(o.notes)}</i>` : ""}</div>
      <div class="when">${t}</div>
      <div class="actions"></div>`;
    const actions = el.querySelector(".actions");
    const toggle = document.createElement("button");
    toggle.className = "mini" + (o.done ? "" : " go");
    toggle.textContent = o.done ? "Undo" : "Ready ✓";
    toggle.onclick = () => update(o.id, x => ({ ...x, done: !x.done }));
    const del = document.createElement("button");
    del.className = "mini";
    del.textContent = "Remove";
    del.onclick = () => { save(load().filter(x => x.id !== o.id)); renderOrders(); };
    actions.append(toggle, del);
    return el;
  }));
}

function update(id, fn) {
  save(load().map(o => o.id === id ? fn(o) : o));
  renderOrders();
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 2200);
}

$("place").onclick = () => {
  const orders = load();
  const num = (orders.reduce((m, o) => Math.max(m, o.num), 0) % 99) + 1;
  const order = {
    id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
    num, name: $("name").value.trim(), desc: describe(),
    notes: $("notes").value.trim(), time: Date.now(), done: false,
  };
  save([...orders, order]);
  toast(`Order #${num} placed for ${order.name} ☕`);
  Object.assign(state, { drink: null, flavor: "none", temp: "Hot" });
  $("name").value = ""; $("notes").value = "";
  render();
};

$("clear-done").onclick = () => { save(load().filter(o => !o.done)); renderOrders(); };
$("name").addEventListener("input", render);

document.querySelectorAll(".tab").forEach(tab => tab.onclick = () => {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tab));
  $("view-order").classList.toggle("hidden", tab.dataset.view !== "order");
  $("view-queue").classList.toggle("hidden", tab.dataset.view !== "queue");
  renderOrders();
});

// Keep multiple open tabs (e.g. customer tablet + barista screen) in sync
window.addEventListener("storage", e => { if (e.key === STORE) renderOrders(); });

render();
</script>
</body>
</html>
